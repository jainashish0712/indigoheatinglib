name: Build & Release IndigoThermalFix

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      target_fps:
        description: 'Default Viewfinder Target FPS (e.g. 30 or 60)'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  build:
    name: Build & Test IndigoThermalFix.dylib
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Pre-build Source & Syntax Verification Tests
        working-directory: IndigoThermalFix
        run: |
          python3 test_tweak.py

      - name: Compile IndigoThermalFix.dylib
        working-directory: IndigoThermalFix
        run: |
          TARGET_FPS="${{ github.event.inputs.target_fps || '30' }}"
          echo "Compiling IndigoThermalFix.dylib with default target FPS: $TARGET_FPS"

          # Attempt universal arm64 + arm64e build, falling back to arm64
          if xcrun -sdk iphoneos clang -arch arm64 -arch arm64e \
            -dynamiclib \
            -O3 \
            -Wall -Wextra -Werror \
            -Wno-error=deprecated-declarations \
            -fobjc-arc \
            -DDEFAULT_TARGET_FPS=$TARGET_FPS \
            -framework Foundation \
            -framework UIKit \
            -framework MetalKit \
            -framework QuartzCore \
            -framework AVFoundation \
            -framework CoreMedia \
            -framework CoreML \
            -install_name @rpath/IndigoThermalFix.dylib \
            -compatibility_version 1.0.0 \
            -current_version 1.0.0 \
            -miphoneos-version-min=15.0 \
            Tweak.m -o IndigoThermalFix.dylib; then
            echo "Successfully built universal arm64 + arm64e dylib"
          else
            echo "Building single-slice arm64 dylib..."
            xcrun -sdk iphoneos clang -arch arm64 \
              -dynamiclib \
              -O3 \
              -Wall -Wextra -Werror \
            -Wno-error=deprecated-declarations \
              -fobjc-arc \
              -DDEFAULT_TARGET_FPS=$TARGET_FPS \
              -framework Foundation \
              -framework UIKit \
              -framework MetalKit \
              -framework QuartzCore \
              -framework AVFoundation \
              -framework CoreMedia \
              -framework CoreML \
              -install_name @rpath/IndigoThermalFix.dylib \
              -compatibility_version 1.0.0 \
              -current_version 1.0.0 \
              -miphoneos-version-min=15.0 \
              Tweak.m -o IndigoThermalFix.dylib
          fi

          # Ad-hoc codesign for iOS loading
          codesign -s - --force IndigoThermalFix.dylib

          # Verify binary architecture and load commands
          otool -hv -L IndigoThermalFix.dylib

      - name: Post-build Binary Verification Tests
        working-directory: IndigoThermalFix
        run: |
          python3 test_tweak.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndigoThermalFix.dylib
          path: IndigoThermalFix/IndigoThermalFix.dylib
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Release (IndigoThermalFix.dylib)' }}
          body: |
            ### IndigoThermalFix.dylib (Zero Quality Loss Camera & Viewfinder Thermal Fix)

            This dynamic library eliminates iPhone 16 Pro overheating with ZERO compromise on image quality:
            - **CoreML Hardware Accelerated (Apple Neural Engine)**: Forces all 9 neural models (`DemosaicFloat16`, `FlowFloat16`, `PatchRefinerCropFloat16`, `look_model`, etc.) to run on the 16-core A18 Pro Apple Neural Engine (35 TOPS) instead of CPUOnly, delivering 3x-5x faster processing.
            - **Producer Capped (AVFoundation)**: Caps `AVCaptureDevice` and `AVCaptureVideoDataOutput` stream to 30 FPS, halving sensor ISP readout, MIPI bus bandwidth, and GPU Metal debayer passes (`updateZslFrameRgbaFromRaw`).
            - **Consumer Capped (MTKView)**: Locks `MTKView` and `CAMetalLayer` rendering to 30 FPS.
            - **Hardware Classification Fixed**: In-memory Swift vtable hook on `ModelSpecificSettings.is17Series` to eliminate inverted bitmask bug on iPhone 16 Pro.
            - **Burst Paced**: In-memory Swift vtable hook on `ModelSpecificSettings.shutterButtonRateLimitDuration` (0.4s) to prevent thermal queue explosion.
            - **100% RAW Fidelity**: Photo capture via `AVCapturePhotoOutput` remains completely untouched, capturing full 48MP uncompressed RAW Bayer frames.
            - **No App Binary Modified**: Pure runtime dynamic hook; leaves application binary untouched.

            #### How to Inject:
            1. **Azule**:
               ```bash
               azule -i Indigo.ipa -o Indigo_Fixed.ipa -f IndigoThermalFix.dylib
               ```
            2. **insert_dylib**:
               ```bash
               cp IndigoThermalFix.dylib Payload/Indigo.app/Frameworks/
               insert_dylib --all-yes @rpath/IndigoThermalFix.dylib Payload/Indigo.app/Indigo Payload/Indigo.app/Indigo
               ```
            3. **Sideloadly / TrollStore / Esign**:
               Add `IndigoThermalFix.dylib` in the tweak/dylib injection settings before installing.
          files: |
            IndigoThermalFix/IndigoThermalFix.dylib
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
